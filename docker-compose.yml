services:
  mysql:
    image: mysql:8.0
    container_name: previsao_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-previsao123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-previsao}
      - MYSQL_USER=${MYSQL_USER:-previsao}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-previsao123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "${MYSQL_USER:-previsao}", "-p${MYSQL_PASSWORD:-previsao123}", "${MYSQL_DATABASE:-previsao}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  previsao:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: previsao
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PREVISAO_IA_PROVEDOR=${PREVISAO_IA_PROVEDOR:-}
      - PREVISAO_IA_MODELO=${PREVISAO_IA_MODELO:-claude-sonnet-4-20250514}
      - PREVISAO_IA_MODELO_OPENAI=${PREVISAO_IA_MODELO_OPENAI:-gpt-4.1}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-previsao}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-previsao123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-previsao}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
